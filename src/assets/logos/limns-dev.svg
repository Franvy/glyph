<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Limns">
  <!-- The site mark as an APP ICON: the comet on a white chip with the corners
       taken off. This file is the browser tab, and nothing else on the site
       looks like it — components/Logo.tsx draws the same comet on a full
       circle, which is the right silhouette beside a wordmark and the wrong
       one in a tab strip, where every neighbour is a rounded square and a disc
       reads as the odd one out. It is the design file's own 100×100 frame
       verbatim: rx 24 is its rounded-3xl, and the comet sits at 11,21 at 77
       wide — a wider mark in a tighter frame than Logo.tsx's, because this one
       is read at 16px.

       The ground is opaque white under both colour schemes on purpose. It is a
       chip, not a glyph: a mark that inverted with the browser theme would be
       a black comet on nothing, and the corners are the only thing carrying
       the shape.

       THE COMMENT IS INSIDE THE ROOT ELEMENT, and that is not a style choice.
       libvips sniffs a file's format by looking for the signature in the first
       a-thousand-or-so bytes, so a header comment this long above <svg> makes
       the file unreadable to sharp — "Input file contains unsupported image
       format", from the one tool that has to open it.

       Source of truth for scripts/build-icons.ts, which rasterises this into
       the .ico and the two PNGs other people's software probes for. Edit here,
       then run "bun run icons". -->
  <rect width="100" height="100" rx="24" fill="#fff" />
