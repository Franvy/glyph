name: ci

# A pull request runs the checks once. A push runs them only on main, before the deploy.
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Same version as @playwright/test in package.json, so the browsers are already installed.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # types + frontmatter
      - run: pnpm test # src/lib + local D1
      - run: pnpm db:migrate:local # local tables for E2E
      - run: pnpm e2e # preview build + smoke tests: links, counts, access
        env: { CI: "1" }
      - if: failure()
        uses: actions/upload-artifact@v4 # traces of the failed tests, so nobody has to reproduce locally
        with: { name: playwright-report, path: playwright-report }

  deploy: # main only, after check is green
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: { group: deploy-main, cancel-in-progress: false } # migrations never run in parallel
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:remote
      - run: pnpm run deploy
